<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MANSA BTP — Administration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      color: #102033;
    }

    .box {
      width: calc(100% - 32px);
      max-width: 520px;
      background: white;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      color: #0b2e59;
    }

    .field {
      margin: 16px 0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd3dc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #0b2e59;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #msg {
      margin-top: 15px;
      min-height: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- CONNEXION -->
  <div class="box" id="loginBox">

    <h1>MANSA BTP</h1>

    <p>Administration privée</p>

    <form id="loginForm">

      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit">
        Se connecter
      </button>

    </form>

    <div id="msg"></div>

  </div>


  <!-- ADMIN -->
  <div class="box hidden" id="adminBox">

    <h1>Administration MANSA BTP</h1>

    <p>Vous êtes connecté.</p>

    <button id="logout">
      Se déconnecter
    </button>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://cwfjfqdkcramkxfakfwx.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3ZmpmcWRrY3JhbWt4ZmFrZnd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjM5MjAsImV4cCI6MjEwNjE5OTkyMH0.6Mg9gJT_4ID4oKKk0jAI9u4l3OY30xna4_itWCu8AMg";

    const sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    const loginBox = document.getElementById("loginBox");
    const adminBox = document.getElementById("adminBox");
    const loginForm = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const msg = document.getElementById("msg");
    const logout = document.getElementById("logout");


    async function checkSession() {

      const {
        data,
        error
      } = await sb.auth.getSession();

      if (error) {
        msg.textContent = "Erreur Supabase : " + error.message;
        return;
      }

      if (data.session) {

        loginBox.classList.add("hidden");
        adminBox.classList.remove("hidden");

      }

    }


    loginForm.addEventListener("submit", async function(e) {

      e.preventDefault();

      msg.textContent = "Connexion...";

      const {
        error
      } = await sb.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });


      if (error) {

        msg.textContent =
          "Erreur : " + error.message;

        return;

      }


      msg.textContent = "";

      await checkSession();

    });


    logout.addEventListener("click", async function() {

      await sb.auth.signOut();

      location.reload();

    });


    checkSession();

  </script>

</body>
</html>
