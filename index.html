<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MANSA BTP — Administration</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f8fb;color:#102033}.box{width:calc(100% - 32px);max-width:1000px;margin:40px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}.hidden{display:none}h1{color:#0b2e59}.field{margin:14px 0}label{display:block;margin-bottom:6px;font-weight:600}input{width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#0b2e59;color:#fff;cursor:pointer}.logout{float:right}.msg{margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:22px}.card{border:1px solid #e4e8ee;border-radius:12px;padding:12px}.card img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#eef2f6}.card h3{font-size:15px;margin:10px 0}.small{font-size:12px;color:#667085}.save{margin-top:10px;background:#f2ad00;color:#102033;font-weight:700}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.status{margin:15px 0;padding:12px;border-radius:9px;background:#f6f8fb}.danger{color:#a61b1b}
</style>
</head><body>
<div class="box" id="loginBox"><h1>MANSA BTP</h1><p>Administration privée</p><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" required></div><button type="submit">Se connecter</button></form><div class="msg" id="loginMsg"></div></div>
<div class="box hidden" id="adminBox"><div class="top"><div><h1>Administration MANSA BTP</h1><p>Gestion privée des images du site</p></div><button class="logout" id="logout">Se déconnecter</button></div><div class="status" id="status">Chargement...</div><div class="grid" id="grid"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://cwfjfqdkcramkxfakfwx.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_qtRxSE2M8p1ZEgg9sOBKog_lfTHC1IT';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY), bucket='site-images';
const labels=['Image 1','Image 2','Image 3','Image 4','Image 5','Image 6','Image 7'];
const loginBox=document.getElementById('loginBox'),adminBox=document.getElementById('adminBox'),loginMsg=document.getElementById('loginMsg'),status=document.getElementById('status'),grid=document.getElementById('grid');
function publicUrl(i){return SUPABASE_URL+'/storage/v1/object/public/'+bucket+'/image-'+i+'?v='+Date.now()}
async function session(){const r=await sb.auth.getSession(); if(r.data.session){loginBox.classList.add('hidden');adminBox.classList.remove('hidden');render();}}
async function render(){grid.innerHTML=''; for(let i=1;i<=7;i++){const c=document.createElement('div');c.className='card';c.innerHTML='<img src="" id="p'+i+'"><h3>'+labels[i-1]+'</h3><div class="small">Choisir une nouvelle photo</div><input id="f'+i+'" type="file" accept="image/*"><br><button class="save" id="b'+i+'">Envoyer cette image</button>';grid.appendChild(c);document.getElementById('p'+i).src=publicUrl(i);document.getElementById('b'+i).onclick=()=>upload(i);}}
async function upload(i){const input=document.getElementById('f'+i),file=input.files?.[0];if(!file)return alert('Choisis une image.');status.textContent='Envoi de '+labels[i-1]+'...';const {error}=await sb.storage.from(bucket).upload('image-'+i,file,{upsert:true,contentType:file.type,cacheControl:'3600'});if(error){status.innerHTML='<span class="danger">Erreur : '+error.message+'</span>';return;}document.getElementById('p'+i).src=publicUrl(i);status.textContent=labels[i-1]+' mise à jour. Recharge le site public pour voir la nouvelle image.';}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg.textContent='Connexion...';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginMsg.textContent='Erreur : '+error.message;return;}loginMsg.textContent='';await session();});
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
session();
</script></body></html>
