<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MANSA BTP — Administration</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#102033}
    .box{max-width:520px;margin:80px auto;background:white;padding:30px;border-radius:14px;box-shadow:0 8px 30px #0001}
    h1{color:#0b2e59}.field{margin:14px 0}label{display:block;margin-bottom:6px;font-weight:600}
    input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3dc;border-radius:8px}
    button{margin-top:15px;background:#0b2e59;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}
    #msg{margin-top:15px}.hidden{display:none}
  </style>
</head>
<body>
<div class="box" id="loginBox">
  <h1>MANSA BTP</h1>
  <p>Administration privée</p>
  <form id="loginForm">
    <div class="field"><label>E-mail</label><input id="email" type="email" required></div>
    <div class="field"><label>Mot de passe</label><input id="password" type="password" required></div>
    <button type="submit">Se connecter</button>
  </form>
  <div id="msg"></div>
</div>
<div class="box hidden" id="adminBox">
  <h1>Administration MANSA BTP</h1>
  <p>Vous êtes connecté.</p>
  <button id="logout">Se déconnecter</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://cwfjfqdkcramkxfakfwx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjd2ZqZGtkY3JhbWt4ZmFrZnd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjM5MjAsImV4cCI6MjEwNjE5OTkyMH0.6Mg9gJT_4ID4oKKk0jAIu4l3OY30xna4_itWCu8AMg";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const msg = document.getElementById("msg");
async function check(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ loginBox.classList.add("hidden"); adminBox.classList.remove("hidden"); }
}
loginForm.addEventListener("submit", async e=>{
  e.preventDefault(); msg.textContent="Connexion...";
  const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});
  if(error) msg.textContent="Erreur : "+error.message; else check();
});
logout.onclick=async()=>{await sb.auth.signOut(); location.reload()};
check();
</script>
</body>
</html>
